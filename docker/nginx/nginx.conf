worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Native HTTP errors include unsanitizable client/request context (even before
    # Laravel). Keep process diagnostics above and the safe JSON access log below.
    # Applies to both public and internal listeners. See docs/observability/README.md.
    error_log /dev/null;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe escape=json '{"source":"nginx","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/conf.d/*.conf;
}
