# Independent from docker-compose.yml. No build, source mounts or published ports.
# Caddy requires --profile https; publishing additionally requires compose.https.yaml.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-php: &php
  image: facubus/devops-tp-php:1.1.0@sha256:be814bb939c98c3912feb5df847f857e5ba750d7a1eed4df98dcd1a4a716318c
  platform: linux/amd64
  env_file:
    - ${ORACLE_SECRETS_DIR:?Use bin/oracle or set ORACLE_SECRETS_DIR}/app.env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    METRICS_ENABLED: "false"
    TRUSTED_PROXIES: ${PROXY_IP:-172.30.77.2}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    platform: linux/amd64
    env_file:
      - ${ORACLE_SECRETS_DIR}/mysql.env
    environment:
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./conf/mysql.cnf:/etc/mysql/conf.d/oracle.cnf:ro
    networks: [database]
    mem_limit: 384m
    memswap_limit: 768m
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

  init:
    <<: *php
    command: [sh, scripts/docker-init.sh]
    volumes:
      - passport_keys:/var/www/html/storage/passport
      - ./conf/php.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
    networks: [database]
    mem_limit: 192m
    memswap_limit: 384m
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *php
    volumes:
      - passport_keys:/var/www/html/storage/passport:ro
      - ./conf/php.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
      - ./conf/zzzz-production.conf:/usr/local/etc/php-fpm.d/zzzz-production.conf:ro
    networks: [database, fastcgi, outbound]
    mem_limit: 192m
    memswap_limit: 384m
    restart: unless-stopped
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: facubus/devops-tp-nginx:1.1.0@sha256:c18a7934b67b4abafcedac45b3a38552fce8f23b92eae2e7c143a7f987f05f24
    platform: linux/amd64
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [fastcgi, proxy]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    memswap_limit: 64m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
        restart: true

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    platform: linux/amd64
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:?Prepare deploy.env}
      ACME_EMAIL: ${ACME_EMAIL:?Prepare deploy.env}
      GOMEMLIMIT: 64MiB
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${PROXY_IP:-172.30.77.2}
      outbound:
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 192m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  mysql_data:
    name: ${VOLUME_PREFIX:-devops_tp_prod}_mysql
    external: true
  passport_keys:
    name: ${VOLUME_PREFIX:-devops_tp_prod}_passport
    external: true
  caddy_data:
    name: ${VOLUME_PREFIX:-devops_tp_prod}_caddy_data
    external: true
  caddy_config:
    name: ${VOLUME_PREFIX:-devops_tp_prod}_caddy_config
    external: true

networks:
  database:
    internal: true
  fastcgi:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.77.0/24}
          # Reserve the lower half for fixed addresses, even before Caddy exists.
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.77.128/25}
  outbound:
