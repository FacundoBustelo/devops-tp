 style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.9632" x="372.213" y="243.897">FK user_id nullable / SET NULL</text></g><rect fill="#DDDDDD" height="124.4075" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="525.9259" x="12" y="490"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="402.5405" x="17" y="509.9659">Modelo de datos del proyecto: usuarios, favoritos y auditor&#237;a.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.6914" x="17" y="529.0339">L&#237;nea continua: FK f&#237;sica.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486.6521" x="17" y="548.1018">NULL expl&#237;cito; dem&#225;s columnas NOT NULL. PK/UNIQUE/INDEX indicados.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486.0501" x="17" y="567.1697">users.deleted_at no ejecuta ON DELETE; acciones aplican al borrado f&#237;sico.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="515.9259" x="17" y="586.2376">GIF_ID compara may&#250;sculas, Unicode y espacios finales exactos en MySQL 8.4.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="368.6467" x="17" y="605.3055">Tablas auxiliares de Laravel y Passport en erd-completo.</text><!--SRC=[bLHBSXen4DtFAJgie0fZaZWknrxQE4MCyGzNPJVLQ1fGh94c-c1FsJbC3i05ikLYQJ4CnfzDTlfql-xtNaiV2elJ745XQO87bvD7ZOcxaxf0Ypcu6MRcNkefJ50vIcOo8n3I2aLRKKfgycL1OAoVcOIqbxw4Hd1aNGFGmMe5Zmc0p60ifr9xk3pZhSQSO8vMpD3obdAKgjx3xR1_TTkhZzCvMJcHbANemSkSdCUyWE7jOC0X1JftRsos1MOfftnCDlNcZlG6TPqWBA5VWRKX5Dbw_HOu8qNlta7JcObVtxUItnlQ4vmRApsbKpcfwByuUK-6g4_wV7Pw1jUzcz5r_tZ4bvmKxzRzDpz-EcX1y9E3VBoNThzsk-bOQWv39RdK9ghRRVq7oqhgvhgFzhhcDYiiPCgzaKNXfT4LiTU7xt6pz2jmiKXXrTdd_TQpiw-8htHbzZUzK