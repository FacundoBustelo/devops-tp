x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-prexchallenge}-app
  build:
    context: .
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  volumes:
    - .:/var/www/html
  networks:
    - backend
    - outbound

services:
  init:
    <<: *app
    command: ["sh", "scripts/docker-init.sh"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend
      - outbound

  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prex}
      MYSQL_USER: ${DB_USERNAME:-prex_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Complete DB_PASSWORD in .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Complete MYSQL_ROOT_PASSWORD in .env first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend
      - outbound

volumes:
  mysql_data:

networks:
  backend:
    internal: true
  # Outbound access supports Composer and the GIPHY integration.
  outbound:
