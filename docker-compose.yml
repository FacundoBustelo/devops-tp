x-app: &app
  image: ${IMAGE_REPOSITORY:-devops-tp}-php:${APP_VERSION:-0.0.0-dev}
  build:
    context: .
    target: runtime
    args:
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      VCS_REF: ${VCS_REF:-unknown}
  environment:
    APP_NAME: ${APP_NAME:-PrexChallenge}
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: ${APP_KEY:?Generate APP_KEY with scripts/init-env.php before starting}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://127.0.0.1:8080}
    APP_LOCALE: ${APP_LOCALE:-en}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    APP_MAINTENANCE_DRIVER: file
    BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    METRICS_ENABLED: "false"
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-prex}
    DB_USERNAME: ${DB_USERNAME:-prex_app}
    DB_PASSWORD: ${DB_PASSWORD:?Complete DB_PASSWORD in .env first}
    SESSION_DRIVER: database
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
    FILESYSTEM_DISK: local
    MAIL_MAILER: log
    GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    GIPHY_CONNECT_TIMEOUT: ${GIPHY_CONNECT_TIMEOUT:-2}
    GIPHY_TIMEOUT: ${GIPHY_TIMEOUT:-5}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  volumes:
    - passport_keys:/var/www/html/storage/passport
  networks:
    - backend
    - outbound

services:
  init:
    <<: *app
    command: ["sh", "scripts/docker-init.sh"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: ${IMAGE_REPOSITORY:-devops-tp}-nginx:${APP_VERSION:-0.0.0-dev}
    build:
      context: .
      target: nginx
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        VCS_REF: ${VCS_REF:-unknown}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - outbound

  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prex}
      MYSQL_USER: ${DB_USERNAME:-prex_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Complete DB_PASSWORD in .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Complete MYSQL_ROOT_PASSWORD in .env first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend
      - outbound

volumes:
  mysql_data:
  passport_keys:

networks:
  backend:
    internal: true
  # PHP needs outbound access to GIPHY.
  outbound:
