groups:
  - name: api
    rules:
      - alert: ApiHigh5xxRate
        expr: |
          (sum(rate(devops_http_requests_total{job="laravel",status=~"5.."}[2m]))
          / sum(rate(devops_http_requests_total{job="laravel"}[2m])) > 0.2)
          and (sum(increase(devops_http_requests_total{job="laravel"}[2m])) >= 10)
          and (min(up{job="laravel",instance="nginx:9091"}) == 1)
        for: 30s
        labels:
          severity: warning
          job: laravel
        annotations:
          summary: API supera 20% de 5xx con volumen suficiente
      - alert: ApiMetricsUnavailable
        expr: up{job="laravel",instance="nginx:9091"} == 0 or absent(up{job="laravel",instance="nginx:9091"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: No se pueden recolectar métricas de Laravel
