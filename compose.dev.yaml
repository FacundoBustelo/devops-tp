# Explicit tooling override; no checkout mount unless compose.source.yaml is also used.
services:
  init:
    image: ${IMAGE_REPOSITORY:-devops-tp}-php-dev:${APP_VERSION:-0.0.0-dev}
    build:
      target: development
  app:
    image: ${IMAGE_REPOSITORY:-devops-tp}-php-dev:${APP_VERSION:-0.0.0-dev}
    build:
      target: development
